[project]
name = "mespy"
version = "2.0.0"
description = "Toolbox Python per l'analisi dei dati di laboratorio"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Giancarmine Sparso", email = "giancarminesparso@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["physics", "statistics", "data analysis", "laboratory", "mechanics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = ["numpy", "pandas", "matplotlib", "scipy", "tomli-w>=1.0"]

[project.urls]
Homepage = "https://github.com/giancarmine-sparso/mespy"
Repository = "https://github.com/giancarmine-sparso/mespy"
Issues = "https://github.com/giancarmine-sparso/mespy/issues"

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff",
  "setuptools>=68",
  "twine",
  "wheel",
  "ipykernel",
  "sphinx>=9.1.0",
  "pydata-sphinx-theme==0.16.1",
  "myst-nb>=1.3.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-intl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mespy = ["py.typed", "stylelib/*.mplstyle"]

[tool.uv.workspace]
members = ["demo"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = [
  "E",
  "W",   # pycodestyle
  "F",   # pyflakes (import inutili, nomi non definiti)
  "I",   # ordinamento import (sostituisce isort)
  "UP",  # sintassi moderna
  "B",   # bugbear: bug comuni
  "NPY", # regole specifiche numpy
]
ignore = ["E501"] # la lunghezza delle righe la gestisce il formatter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # re-export voluti
"tests/*" = ["B"]

[tool.ruff.format]
quote-style = "double"
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "sphinx>=9.1.0",
  "pydata-sphinx-theme==0.16.1",
  "myst-nb>=1.3.0",
  "sphinx-copybutton>=0.5.2",
  "build>=1.4.2",
  "twine>=6.2.0",
  "pre-commit>=4.7.0",
  "commitizen>=4.20.1",
]
docs = ["sphinx-intl>=2.3.2"]
