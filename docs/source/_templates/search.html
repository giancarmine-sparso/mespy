{% extends "!search.html" %}

{% block body_tag %}
<body class="mespy-home mespy-guide mespy-system" data-default-mode="{{ default_mode }}">
  <a class="mh-skip" href="#main-content">{{ home('Vai al contenuto') }}</a>
{% endblock %}

{% block content %}
  {% set system_body = self.docs_body() %}
  {% include "components/system-page-content.html" %}
  {{ self.scripts_end() }}
  <script>
    // The shared header also has a hidden search field; focus the visible one.
    const systemSearchInput = document.querySelector('#main-content form.bd-search input[name="q"]');
    if (systemSearchInput) {
      systemSearchInput.focus();
      systemSearchInput.select();
    }
  </script>
{% endblock %}

{% block footer %}{% endblock %}
